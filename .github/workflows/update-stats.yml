name: Update README stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate complete contribution stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-contribution-stats.mjs

      - name: Fetch streak card
        run: |
          curl -fSL --retry 3 --retry-delay 10 --max-time 180 \
            "https://streak-stats.demolab.com/?user=BohdanRykush&theme=tokyonight&hide_border=true&background=0d1117&stroke=0d1117&ring=38BDF8&fire=38BDF8&currStreakNum=C9D1D9&currStreakLabel=8B949E&sideNums=C9D1D9&sideLabels=8B949E&dates=484F58" \
            -o assets/streak.svg

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/streak.svg
          git diff --staged --quiet || git commit -m "chore: update README stats SVGs"
          git pull --rebase origin main
          git push
